# Zaman Atlası — Android APK derleme
# Depodaki zip dosyasını (ya da açık proje klasörünü) bulur, imzalı APK üretir,
# APK'yı "Releases" sayfasına ve iş akışı çıktılarına (Artifacts) ekler.
name: Zaman Atlası APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasörünü bul (zip ya da açık klasör)
        id: src
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Zip bulundu: $ZIP"
            unzip -q -o "$ZIP" -d _src
          fi
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/android/*' | head -n1)
          if [ -z "$CFG" ]; then echo "capacitor.config.json bulunamadı. Zip dosyasını depoya yüklediğinizden emin olun."; exit 1; fi
          DIR=$(dirname "$CFG")
          echo "Proje klasörü: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıkları kur ve Android projesini eşitle
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: İmzalı APK derle
        working-directory: ${{ steps.src.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ZamanAtlasi-1.0.${{ github.run_number }}.apk"

      - name: APK'yı iş akışı çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ZamanAtlasi-1.0.${{ github.run_number }}
          path: ZamanAtlasi-1.0.${{ github.run_number }}.apk

      - name: APK'yı Releases sayfasına ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zaman Atlası 1.0.${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki APK dosyasını indirip açın.
            İlk kurulumda "bilinmeyen kaynaklardan yükleme" izni istenebilir.
          files: ZamanAtlasi-1.0.${{ github.run_number }}.apk
